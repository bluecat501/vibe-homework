<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  
  <title>全息光柵雙形態 - 沉浸橫屏版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    /* 浮動控制列：閒置自動半隱藏，避免遮擋畫面 */
    .header-bar {
      position: absolute;
      top: 14px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 20, 35, 0.65);
      backdrop-filter: blur(12px);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .header-bar.fade-out {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    .ctl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.85);
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .ctl-btn.active {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      font-weight: 600;
    }
    .divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* 舞台容器 */
    #cardContainer {
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      transition: width 0.3s ease, height 0.3s ease, transform 0.08s ease-out;
    }

    /* 電腦 3D 卡片模式 */
    .mode-3d-card {
      width: min(84vw, calc(72vh * (9 / 16)));
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(99, 102, 241, 0.3);
    }

    /* 手機滿版貼屏模式（橫向完全滿版） */
    .mode-fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      aspect-ratio: auto !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      transform: none !important;
    }

    /* 形態 A / B 圖層 */
    .layer-a, .layer-b {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .layer-a { z-index: 1; }
    .layer-b {
      z-index: 2;
      opacity: 0;
      will-change: opacity;
    }

    .photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* 全息彩虹流光層 */
    .hologram-sheen {
      position: absolute;
      inset: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(255, 0, 150, 0.22) 42%,
        rgba(0, 240, 255, 0.3) 49%,
        rgba(255, 255, 255, 0.5) 51%,
        rgba(255, 215, 0, 0.3) 55%,
        transparent 65%
      );
      mix-blend-mode: color-dodge;
      pointer-events: none;
      z-index: 3;
      will-change: transform;
    }

    /* 光柵線條 */
    .lenticular-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 4;
    }

    /* 手機直立時的橫屏引導提示 */
    #orientTip {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 16px;
      letter-spacing: 1px;
    }
    #orientTip .icon {
      font-size: 40px;
      margin-bottom: 12px;
      animation: rotateHint 1.8s ease-in-out infinite alternate;
    }
    @keyframes rotateHint {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(90deg); }
    }
  </style>
</head>
<body>
  <!-- 橫屏轉向提示 -->
  <div id="orientTip">
    <div class="icon">📱 ➔ 🔄</div>
    <div>請將手機橫向放置以進入純淨無遮模式</div>
  </div>

  <!-- 隱藏圖片上傳 -->
  <input type="file" id="uploadA" accept="image/*" style="display:none" />
  <input type="file" id="uploadB" accept="image/*" style="display:none" />

  <!-- 頂部功能列（閒置自動淡出） -->
  <div class="header-bar" id="headerBar">
    <button class="ctl-btn" id="btn-mode-phone">📱 滿版</button>
    <button class="ctl-btn" id="btn-mode-card">💻 3D卡</button>
    <div class="divider"></div>
    <button class="ctl-btn" id="btn-upload-a">換圖A</button>
    <button class="ctl-btn" id="btn-upload-b">換圖B</button>
  </div>

  <!-- 主舞台 -->
  <div id="cardContainer" class="mode-3d-card">
    <div class="layer-a">
      <img class="photo" id="imgA" src="blue.jpg" alt="形態 A" />
    </div>

    <div class="layer-b" id="layerB">
      <img class="photo" id="imgB" src="gold.jpg" alt="形態 B" />
    </div>

    <div class="hologram-sheen" id="sheen"></div>
    <div class="lenticular-lines"></div>
  </div>

  <script>
    const card = document.getElementById('cardContainer');
    const layerB = document.getElementById('layerB');
    const sheen = document.getElementById('sheen');
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');
    const headerBar = document.getElementById('headerBar');
    const orientTip = document.getElementById('orientTip');

    const btnModePhone = document.getElementById('btn-mode-phone');
    const btnModeCard = document.getElementById('btn-mode-card');
    const btnUploadA = document.getElementById('btn-upload-a');
    const btnUploadB = document.getElementById('btn-upload-b');
    const uploadA = document.getElementById('uploadA');
    const uploadB = document.getElementById('uploadB');

    const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let currentMode = isMobileDevice ? 'fullscreen' : 'card';

    // 檢查直向或橫向
    function checkOrientation() {
      if (isMobileDevice && currentMode === 'fullscreen') {
        const isPortrait = window.innerHeight > window.innerWidth;
        orientTip.style.display = isPortrait ? 'flex' : 'none';
      } else {
        orientTip.style.display = 'none';
      }
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'fullscreen') {
        card.className = 'mode-fullscreen';
        btnModePhone.classList.add('active');
        btnModeCard.classList.remove('active');
      } else {
        card.className = 'mode-3d-card';
        btnModeCard.classList.add('active');
        btnModePhone.classList.remove('active');
      }
      checkOrientation();
      applyTransform(0, 0);
    }

    btnModePhone.addEventListener('click', () => setMode('fullscreen'));
    btnModeCard.addEventListener('click', () => setMode('card'));

    // 換圖功能
    btnUploadA.addEventListener('click', () => uploadA.click());
    btnUploadB.addEventListener('click', () => uploadB.click());

    uploadA.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { imgA.src = evt.target.result; };
        reader.readAsDataURL(file);
      }
    });

    uploadB.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { imgB.src = evt.target.result; };
        reader.readAsDataURL(file);
      }
    });

    // 頂部選單閒置 3 秒自動隱藏，點螢幕重新喚出
    let hideTimer = null;
    function resetMenuTimeout() {
      headerBar.classList.remove('fade-out');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        headerBar.classList.add('fade-out');
      }, 3000);
    }
    window.addEventListener('click', resetMenuTimeout);
    window.addEventListener('touchstart', resetMenuTimeout);
    resetMenuTimeout();

    // 姿態運算
    function applyTransform(tiltX, tiltY = 0) {
      const clampedX = Math.max(-30, Math.min(30, tiltX));
      const clampedY = Math.max(-20, Math.min(20, tiltY));

      if (currentMode === 'card') {
        card.style.transform = `rotateY(${clampedX * 0.9}deg) rotateX(${-clampedY * 0.7}deg)`;
      } else {
        card.style.transform = 'none';
      }

      const blend = Math.max(0, Math.min(1, (clampedX + 18) / 36));
      layerB.style.opacity = blend.toFixed(3);

      const sheenOffset = (blend - 0.5) * 120;
      sheen.style.transform = `translate3d(${sheenOffset}%, 0, 0)`;
    }

    // 陀螺儀（依手機是直立還是橫躺自動調校感測軸）
    function handleOrientation(e) {
      const isLandscape = window.innerWidth > window.innerHeight;
      let angle = 0;
      if (isLandscape) {
        // 橫屏時，主要的左右傾斜來自 beta 軸
        angle = e.beta || 0;
      } else {
        // 直屏時來自 gamma 軸
        angle = e.gamma || 0;
      }
      applyTransform(angle, 0);
    }

    let sensorStarted = false;
    function startSensor() {
      if (sensorStarted) return;
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              sensorStarted = true;
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        sensorStarted = true;
      }
    }
    window.addEventListener('touchstart', startSensor, { once: true });
    window.addEventListener('click', startSensor, { once: true });
    startSensor();

    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) - 0.5;
      const normY = (e.clientY / window.innerHeight) - 0.5;
      applyTransform(normX * 60, normY * 40);
    });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const normX = (touch.clientX / window.innerWidth) - 0.5;
      applyTransform(normX * 60, 0);
    }, { passive: true });

    setMode(currentMode);
  </script>
</body>
</html>

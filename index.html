<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- 宣告為獨立 App 並鎖定為橫屏手遊模式 (Landscape Only) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22HoloCard%22%2C%22short_name%22%3A%22HoloCard%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22landscape%22%7D" />

  <title>全息光柵雙形態</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #0e111d 0%, #030408 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    /* 頂部選單：3 秒自動淡出 */
    .header-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 20, 35, 0.72);
      backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
      
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                  visibility 0.45s;
      visibility: visible;
    }
    .header-bar::-webkit-scrollbar {
      display: none;
    }

    .header-bar.fade-hidden {
      opacity: 0 !important;
      transform: translateY(-30px) !important;
      visibility: hidden;
    }

    .ctl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .ctl-btn.active {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* 3D 舞台卡片容器 */
    #cardContainer {
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
    }

    /* 1. PC 3D 直立卡片 (9:16) */
    .mode-card-portrait {
      width: min(84vw, calc(72vh * (9 / 16)));
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(99, 102, 241, 0.3);
    }

    /* 2. PC 3D 橫擺卡片 (保持原始比例旋轉 90 度橫躺，不切邊) */
    .mode-card-landscape {
      height: min(84vw, calc(72vh * (9 / 16)));
      width: calc(min(84vw, calc(72vh * (9 / 16))) * (16 / 9));
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(99, 102, 241, 0.3);
    }

    /* 3. 手機版 直向貼屏 */
    .mode-phone-portrait {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      transform: none !important;
    }

    /* 4. 手機版 強制手遊級橫向鎖定（雙層自適應：不論 iOS 是直是橫，永遠維持橫向滿屏） */
    .mode-phone-landscape-locked {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    .layer-a, .layer-b {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .layer-a { z-index: 1; }
    .layer-b {
      z-index: 2;
      opacity: 0;
      will-change: opacity;
    }

    .photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* PC 橫擺卡片時內部旋轉以完整容納直式原畫 */
    .mode-card-landscape .photo {
      object-fit: contain;
      transform: rotate(90deg) scale(1.78);
    }

    /* 全息彩虹流光層 */
    .hologram-sheen {
      position: absolute;
      inset: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(255, 0, 150, 0.22) 42%,
        rgba(0, 240, 255, 0.3) 49%,
        rgba(255, 255, 255, 0.5) 51%,
        rgba(255, 215, 0, 0.3) 55%,
        transparent 65%
      );
      mix-blend-mode: color-dodge;
      pointer-events: none;
      z-index: 3;
      will-change: transform;
    }

    /* 光柵線條細紋 */
    .lenticular-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>
<body>
  <input type="file" id="uploadA" accept="image/*" style="display:none" />
  <input type="file" id="uploadB" accept="image/*" style="display:none" />

  <!-- 頂部功能列 -->
  <div class="header-bar" id="headerBar">
    <button class="ctl-btn" id="btn-mode-phone">📱 手機版</button>
    <button class="ctl-btn" id="btn-mode-card">💻 PC</button>
    <button class="ctl-btn" id="btn-orientation">🔄 轉橫向</button>
    <div class="divider"></div>
    <button class="ctl-btn" id="btn-upload-a">🖼️ 換圖A</button>
    <button class="ctl-btn" id="btn-upload-b">🖼️ 換圖B</button>
  </div>

  <!-- 主舞台 -->
  <div id="cardContainer" class="mode-card-portrait">
    <div class="layer-a">
      <img class="photo" id="imgA" src="blue.jpg" alt="形態 A" />
    </div>

    <div class="layer-b" id="layerB">
      <img class="photo" id="imgB" src="gold.jpg" alt="形態 B" />
    </div>

    <div class="hologram-sheen" id="sheen"></div>
    <div class="lenticular-lines"></div>
  </div>

  <script>
    const card = document.getElementById('cardContainer');
    const layerB = document.getElementById('layerB');
    const sheen = document.getElementById('sheen');
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');
    const headerBar = document.getElementById('headerBar');

    const btnModePhone = document.getElementById('btn-mode-phone');
    const btnModeCard = document.getElementById('btn-mode-card');
    const btnOrientation = document.getElementById('btn-orientation');
    const btnUploadA = document.getElementById('btn-upload-a');
    const btnUploadB = document.getElementById('btn-upload-b');
    const uploadA = document.getElementById('uploadA');
    const uploadB = document.getElementById('uploadB');

    const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let currentDevice = isMobileDevice ? 'phone' : 'card';
    let isLandscape = false;

    function updateView() {
      if (currentDevice === 'phone') {
        btnModePhone.classList.add('active');
        btnModeCard.classList.remove('active');
        if (isLandscape) {
          card.className = 'mode-phone-landscape-locked';
          btnOrientation.innerText = '🔄 轉直向';
        } else {
          card.className = 'mode-phone-portrait';
          btnOrientation.innerText = '🔄 轉橫向';
        }
      } else {
        btnModeCard.classList.add('active');
        btnModePhone.classList.remove('active');
        if (isLandscape) {
          card.className = 'mode-card-landscape';
          btnOrientation.innerText = '🔄 轉直卡';
        } else {
          card.className = 'mode-card-portrait';
          btnOrientation.innerText = '🔄 轉橫卡';
        }
      }

      applyTransform(0, 0);
      showAndResetTimer();
    }

    btnModePhone.addEventListener('click', () => {
      currentDevice = 'phone';
      updateView();
    });

    btnModeCard.addEventListener('click', () => {
      currentDevice = 'card';
      updateView();
    });

    btnOrientation.addEventListener('click', (e) => {
      e.stopPropagation();
      isLandscape = !isLandscape;
      updateView();
    });

    // 換圖功能
    btnUploadA.addEventListener('click', (e) => { e.stopPropagation(); uploadA.click(); });
    btnUploadB.addEventListener('click', (e) => { e.stopPropagation(); uploadB.click(); });

    uploadA.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { imgA.src = evt.target.result; };
        reader.readAsDataURL(file);
      }
      showAndResetTimer();
    });

    uploadB.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { imgB.src = evt.target.result; };
        reader.readAsDataURL(file);
      }
      showAndResetTimer();
    });

    // 3 秒無操作自動隱藏與喚醒
    let inactiveTimer = null;
    function hideMenuBar() {
      headerBar.classList.add('fade-hidden');
    }

    function showAndResetTimer() {
      headerBar.classList.remove('fade-hidden');
      clearTimeout(inactiveTimer);
      inactiveTimer = setTimeout(hideMenuBar, 3000);
    }

    window.addEventListener('click', showAndResetTimer);
    window.addEventListener('touchstart', showAndResetTimer, { passive: true });
    showAndResetTimer();

    // 姿態運算
    let lastTiltX = 0;
    function applyTransform(tiltX, tiltY = 0) {
      const clampedX = Math.max(-30, Math.min(30, tiltX));
      const clampedY = Math.max(-20, Math.min(20, tiltY));

      if (currentDevice === 'card') {
        card.style.transform = `rotateY(${clampedX * 0.9}deg) rotateX(${-clampedY * 0.7}deg)`;
      } else if (isLandscape) {
        // 手遊鎖定橫屏核心演算法：
        // 偵測目前 iOS 視窗長寬。如果系統是在直向狀態，我們就透過 CSS 逆轉 90 度鋪滿；
        // 如果系統已經被轉橫了，就自然填滿。這樣不管 iOS 系統怎麼跳，在使用者眼中「永遠都是橫的」！
        const isSystemPortrait = window.innerHeight > window.innerWidth;
        if (isSystemPortrait) {
          card.style.position = 'fixed';
          card.style.top = '50%';
          card.style.left = '50%';
          card.style.width = '100vh';
          card.style.height = '100vw';
          card.style.transform = 'translate(-50%, -50%) rotate(90deg)';
        } else {
          card.style.position = 'absolute';
          card.style.top = '0';
          card.style.left = '0';
          card.style.width = '100vw';
          card.style.height = '100vh';
          card.style.transform = 'none';
        }
      } else {
        card.style.position = 'relative';
        card.style.transform = 'none';
      }

      // 形態 A/B 漸變
      const blend = Math.max(0, Math.min(1, (clampedX + 18) / 36));
      layerB.style.opacity = blend.toFixed(3);

      // 全息彩虹流光位移
      const sheenOffset = (blend - 0.5) * 120;
      sheen.style.transform = `translate3d(${sheenOffset}%, 0, 0)`;

      if (Math.abs(tiltX - lastTiltX) > 1.2) {
        clearTimeout(inactiveTimer);
        inactiveTimer = setTimeout(hideMenuBar, 3000);
      }
      lastTiltX = tiltX;
    }

    // 監聽螢幕變動（防止跳轉）
    window.addEventListener('resize', () => applyTransform(0, 0));
    window.addEventListener('orientationchange', () => applyTransform(0, 0));

    // 陀螺儀
    function handleOrientation(e) {
      let angle = 0;
      if (currentDevice === 'phone' && isLandscape) {
        // 橫屏模式下主要由 beta 或 gamma 換算傾斜
        const isSystemPortrait = window.innerHeight > window.innerWidth;
        angle = isSystemPortrait ? ((e.beta || 0) - 30) : (e.gamma || 0);
      } else {
        angle = e.gamma || 0;
      }
      applyTransform(angle, 0);
    }

    let sensorStarted = false;
    function startSensor() {
      if (sensorStarted) return;
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              sensorStarted = true;
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        sensorStarted = true;
      }
    }

    window.addEventListener('touchstart', startSensor, { once: true });
    window.addEventListener('click', startSensor, { once: true });
    startSensor();

    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) - 0.5;
      const normY = (e.clientY / window.innerHeight) - 0.5;
      applyTransform(normX * 60, normY * 40);
      showAndResetTimer();
    });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const normX = (touch.clientX / window.innerWidth) - 0.5;
      applyTransform(normX * 60, 0);
      showAndResetTimer();
    }, { passive: true });

    updateView();
  </script>
</body>
</html>

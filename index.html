<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- iOS 加入主畫面專用：全螢幕與黑色狀態列設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  
  <title>全息光柵雙形態</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    /* 頂部選單：避開動態島/瀏海安全區 */
    .header-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 20, 35, 0.75);
      backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-bar::-webkit-scrollbar {
      display: none;
    }

    .ctl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .ctl-btn.active {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* 核心舞台容器 */
    #cardContainer {
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease, transform 0.08s ease-out;
    }

    /* 模式 1：電腦 3D 懸浮卡片 */
    .mode-3d-card {
      width: min(84vw, calc(68vh * (9 / 16)));
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(99, 102, 241, 0.3);
    }

    /* 模式 2：手機滿版貼屏（徹底填滿頂部與底部安全區） */
    .mode-fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      aspect-ratio: auto !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      transform: none !important;
    }

    /* 形態 A（深藍）圖層 */
    .layer-a {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 形態 B（金耀）圖層 */
    .layer-b {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      opacity: 0;
      will-change: opacity;
    }

    .photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* 全息彩虹流光層 */
    .hologram-sheen {
      position: absolute;
      inset: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        115deg,
        transparent 30%,
        rgba(255, 0, 150, 0.22) 42%,
        rgba(0, 240, 255, 0.3) 49%,
        rgba(255, 255, 255, 0.5) 51%,
        rgba(255, 215, 0, 0.3) 55%,
        transparent 65%
      );
      mix-blend-mode: color-dodge;
      pointer-events: none;
      z-index: 3;
      will-change: transform;
    }

    /* 光柵垂直紋理 */
    .lenticular-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>
<body>
  <!-- 隱藏的本地圖片輸入框 -->
  <input type="file" id="uploadA" accept="image/*" style="display:none" />
  <input type="file" id="uploadB" accept="image/*" style="display:none" />

  <!-- 頂部功能列 -->
  <div class="header-bar">
    <button class="ctl-btn" id="btn-mode-phone">📱 phone</button>
    <button class="ctl-btn" id="btn-mode-card">💻 pc</button>
    <button class="ctl-btn" id="btn-fullscreen">⛶ 全螢幕</button>
    <div class="divider"></div>
    <button class="ctl-btn" id="btn-upload-a">🖼️ 換圖A</button>
    <button class="ctl-btn" id="btn-upload-b">🖼️ 換圖B</button>
  </div>

  <!-- 主舞台 -->
  <div id="cardContainer" class="mode-3d-card">
    <div class="layer-a">
      <img class="photo" id="imgA" src="blue.jpg" alt="形態 A" />
    </div>

    <div class="layer-b" id="layerB">
      <img class="photo" id="imgB" src="gold.jpg" alt="形態 B" />
    </div>

    <div class="hologram-sheen" id="sheen"></div>
    <div class="lenticular-lines"></div>
  </div>

  <script>
    const card = document.getElementById('cardContainer');
    const layerB = document.getElementById('layerB');
    const sheen = document.getElementById('sheen');
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');

    const btnModePhone = document.getElementById('btn-mode-phone');
    const btnModeCard = document.getElementById('btn-mode-card');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnUploadA = document.getElementById('btn-upload-a');
    const btnUploadB = document.getElementById('btn-upload-b');
    const uploadA = document.getElementById('uploadA');
    const uploadB = document.getElementById('uploadB');

    const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let currentMode = isMobileDevice ? 'fullscreen' : 'card';

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'fullscreen') {
        card.className = 'mode-fullscreen';
        btnModePhone.classList.add('active');
        btnModeCard.classList.remove('active');
      } else {
        card.className = 'mode-3d-card';
        btnModeCard.classList.add('active');
        btnModePhone.classList.remove('active');
      }
      applyTransform(0, 0);
    }

    btnModePhone.addEventListener('click', () => setMode('fullscreen'));
    btnModeCard.addEventListener('click', () => setMode('card'));

    // 全螢幕切換
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(console.error);
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
        btnFullscreen.innerText = '🗗 退出全螢幕';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(console.error);
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        btnFullscreen.innerText = '⛶ 全螢幕';
      }
    });

    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.innerText = document.fullscreenElement ? '🗗 退出全螢幕' : '⛶ 全螢幕';
    });

    // 換圖功能
    btnUploadA.addEventListener('click', () => uploadA.click());
    btnUploadB.addEventListener('click', () => uploadB.click());

    uploadA.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { imgA.src = evt.target.result; };
        reader.readAsDataURL(file);
      }
    });

    uploadB.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { imgB.src = evt.target.result; };
        reader.readAsDataURL(file);
      }
    });

    // 姿態運算
    function applyTransform(tiltX, tiltY = 0) {
      const clampedX = Math.max(-30, Math.min(30, tiltX));
      const clampedY = Math.max(-20, Math.min(20, tiltY));

      if (currentMode === 'card') {
        card.style.transform = `rotateY(${clampedX * 0.9}deg) rotateX(${-clampedY * 0.7}deg)`;
      } else {
        card.style.transform = 'none';
      }

      const blend = Math.max(0, Math.min(1, (clampedX + 18) / 36));
      layerB.style.opacity = blend.toFixed(3);

      const sheenOffset = (blend - 0.5) * 120;
      sheen.style.transform = `translate3d(${sheenOffset}%, 0, 0)`;
    }

    // 陀螺儀
    function handleOrientation(e) {
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      applyTransform(gamma, beta - 45);
    }

    let sensorStarted = false;
    function startSensor() {
      if (sensorStarted) return;
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              sensorStarted = true;
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        sensorStarted = true;
      }
    }

    window.addEventListener('touchstart', startSensor, { once: true });
    window.addEventListener('click', startSensor, { once: true });
    startSensor();

    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) - 0.5;
      const normY = (e.clientY / window.innerHeight) - 0.5;
      applyTransform(normX * 60, normY * 40);
    });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const normX = (touch.clientX / window.innerWidth) - 0.5;
      const normY = (touch.clientY / window.innerHeight) - 0.5;
      applyTransform(normX * 60, normY * 40);
    }, { passive: true });

    setMode(currentMode);
  </script>
</body>
</html>

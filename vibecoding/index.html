<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>全息光柵翻轉卡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #0e111d 0%, #030408 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    /* 頂部操作與提示欄 */
    .top-bar {
      position: absolute;
      top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 30;
      width: 90%;
      max-width: 480px;
    }
    .hint-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: pulse 2.5s infinite ease-in-out;
    }
    .size-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #93c5fd;
      background: rgba(30, 58, 138, 0.4);
      border: 1px solid rgba(147, 197, 253, 0.35);
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 自訂更換照片按鈕群 */
    .upload-group {
      display: flex;
      gap: 8px;
      background: rgba(20, 24, 40, 0.7);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .upload-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .upload-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .upload-btn input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* 3D 卡片外層容器：鎖定 9:16 直式比例 */
    .card-container {
      position: relative;
      width: min(82vw, calc(68vh * (9 / 16)));
      aspect-ratio: 9 / 16;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.08s ease-out;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(99, 102, 241, 0.3);
      margin-top: 36px;
    }

    /* 卡片主體 */
    .hologram-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      transform-style: preserve-3d;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background-color: #0b0d19;
    }

    /* 形態 A 圖層（深藍・馥夢） */
    .layer-a {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    /* 形態 B 圖層（金耀・繁花） */
    .layer-b {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      opacity: 0;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* 全息彩虹折射層 */
    .hologram-sheen {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        115deg,
        transparent 25%,
        rgba(255, 0, 128, 0.22) 36%,
        rgba(0, 240, 255, 0.28) 46%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 215, 0, 0.3) 54%,
        transparent 70%
      );
      mix-blend-mode: color-dodge;
      pointer-events: none;
      transform: translate3d(0, 0, 20px);
      z-index: 3;
      will-change: transform;
    }

    /* 光柵垂直細條紋理 */
    .lenticular-texture {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.04) 0px,
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 4;
    }

    /* 底部操作欄 */
    .bottom-controls {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }
    .ctl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 7px 16px;
      font-size: 13px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctl-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="hint-text" id="hint-text">📱 左右傾斜或滑動，即可切換雙形態</div>
    <div class="size-badge">📐 建議上傳 9:16 直式照片，呈現最佳翻轉對齊效果</div>
    <div class="upload-group">
      <label class="upload-btn">
        📷 更換形態 A 
        <input type="file" id="inputA" accept="image/*" />
      </label>
      <label class="upload-btn">
        📷 更換形態 B 
        <input type="file" id="inputB" accept="image/*" />
      </label>
    </div>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="hologram-card">
      <!-- 形態 A 圖層：載入本地 blue.jpg -->
      <div class="layer-a" id="layerA">
        <img class="card-img" id="imgA" src="blue.jpg" alt="形態 A (藍夜)" />
      </div>

      <!-- 形態 B 圖層：載入本地 gold.jpg -->
      <div class="layer-b" id="layerB">
        <img class="card-img" id="imgB" src="gold.jpg" alt="形態 B (金耀)" />
      </div>

      <!-- 全息彩虹折射層與光柵細紋 -->
      <div class="hologram-sheen" id="sheenLayer"></div>
      <div class="lenticular-texture"></div>
    </div>
  </div>

  <div class="bottom-controls">
    <button class="ctl-btn" id="btn-sensor">啟用手機翻轉感應</button>
    <button class="ctl-btn" id="btn-auto">自動擺動展示</button>
  </div>

  <script>
    const card = document.getElementById('cardContainer');
    const layerA = document.getElementById('layerA');
    const layerB = document.getElementById('layerB');
    const imgA = document.getElementById('imgA');
    const imgB = document.getElementById('imgB');
    const inputA = document.getElementById('inputA');
    const inputB = document.getElementById('inputB');
    const sheenLayer = document.getElementById('sheenLayer');
    const hintText = document.getElementById('hint-text');
    const btnSensor = document.getElementById('btn-sensor');
    const btnAuto = document.getElementById('btn-auto');

    let autoPlay = false;
    let autoPlayAngle = 0;

    // 1. 照片本地替換 (FileReader API)
    function handleImageUpload(inputElement, targetImg) {
      inputElement.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            targetImg.src = evt.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
    }
    handleImageUpload(inputA, imgA);
    handleImageUpload(inputB, imgB);

    // 2. 核心 3D 姿態與光柵交叉溶解
    function applyTransform(tiltX, tiltY) {
      const clampedX = Math.max(-35, Math.min(35, tiltX));
      const clampedY = Math.max(-25, Math.min(25, tiltY));

      card.style.transform = `rotateY(${clampedX * 0.9}deg) rotateX(${-clampedY * 0.7}deg)`;

      // 翻轉角度映射過渡
      const blend = Math.max(0, Math.min(1, (clampedX + 18) / 36));
      layerB.style.opacity = blend.toFixed(3);
      layerA.style.opacity = (1 - blend).toFixed(3);

      // 全息光斑位移
      const sheenOffset = (blend - 0.5) * 80;
      sheenLayer.style.transform = `translate3d(${sheenOffset}%, 0, 20px)`;
    }

    // 3. 陀螺儀支援
    function handleOrientation(e) {
      if (autoPlay) return;
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      applyTransform(gamma, beta - 45);
    }

    btnSensor.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              btnSensor.style.display = 'none';
              hintText.innerText = '✨ 陀螺儀已連動，轉動手機即可切換相片 ✨';
            } else {
              alert('未取得感測器授權，仍可透過滑鼠或滑動體驗！');
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        btnSensor.style.display = 'none';
        hintText.innerText = '✨ 陀螺儀已啟動，轉動手機即可切換相片 ✨';
      }
    });

    // 4. 滑鼠與觸控拖曳
    function handlePointerMove(e) {
      if (autoPlay) return;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      if (clientX === undefined) return;

      const normX = (clientX / window.innerWidth) - 0.5;
      const normY = (clientY / window.innerHeight) - 0.5;
      applyTransform(normX * 60, normY * 40);
    }

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', handlePointerMove, { passive: true });

    // 5. 自動擺動展示
    btnAuto.addEventListener('click', () => {
      autoPlay = !autoPlay;
      btnAuto.innerText = autoPlay ? '停止自動展示' : '自動擺動展示';
    });

    function loopAutoPlay() {
      if (autoPlay) {
        autoPlayAngle += 0.035;
        const tilt = Math.sin(autoPlayAngle) * 25;
        applyTransform(tilt, Math.cos(autoPlayAngle * 0.5) * 8);
      }
      requestAnimationFrame(loopAutoPlay);
    }
    loopAutoPlay();

    applyTransform(0, 0);
  </script>
</body>
</html>
